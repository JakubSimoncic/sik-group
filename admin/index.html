<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIK-GROUP | CMS Rozcestník</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #070707;
            --card-border: #181818;
            --accent-cyan: #00D1C7;
            --text-main: #ffffff;
            --text-muted: #777777;
            --input-bg: #0f0f0f;
            --input-border: #222222;
            --danger-red: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .admin-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-title span { color: var(--accent-cyan); }

        .settings-toggle-btn {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .settings-toggle-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .config-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
            display: none;
        }

        .config-panel.open { display: block; }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
        }

        .admin-view { display: none; }
        .admin-view.active { display: block; }

        .btn-primary {
            background: var(--accent-cyan);
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-delete {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: var(--danger-red);
            padding: 8px 14px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #ffffff;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 6px;
            gap: 20px;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-thumb {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #000;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }

        .item-details h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .item-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .item-actions { display: flex; gap: 10px; }

        .spec-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .terminal-log {
            background: #040404;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 18px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 40px;
            max-height: 160px;
            overflow-y: auto;
        }

        .log-entry { margin-bottom: 6px; }
        .log-entry.success { color: var(--accent-cyan); }
        .log-entry.error { color: var(--danger-red); }
    </style>
</head>
<body>

<div class="admin-wrapper">
    
    <div class="header-bar">
        <div class="brand-title">SIK-GROUP <span>// CMS ROZCESTNÍK</span></div>
        <button class="settings-toggle-btn" id="toggle-settings-btn">⚙ NASTAVENÍ</button>
    </div>

    <!-- PANEL NASTAVENÍ GITHUBU -->
    <div class="config-panel" id="config-panel">
        <h3 style="font-size: 0.9rem; margin-bottom: 15px; color: var(--accent-cyan);">Konfigurace GitHub Repozitáře</h3>
        <div class="form-grid-3">
            <div class="field-group">
                <label>Vlastník (Owner)</label>
                <input type="text" id="gh-owner" value="JakubSimoncic">
            </div>
            <div class="field-group">
                <label>Repozitář (Repo)</label>
                <input type="text" id="gh-repo" value="sik-group">
            </div>
            <div class="field-group">
                <label>Větev (Branch)</label>
                <input type="text" id="gh-branch" value="main">
            </div>
        </div>
        <div class="field-group">
            <label>Personal Access Token (PAT)</label>
            <input type="password" id="gh-token" placeholder="github_pat_...">
        </div>
        <button class="btn-secondary" id="save-config-btn">Uložit Konfiguraci</button>
    </div>

    <!-- VIEW 1: ROZCESTNÍK -->
    <div class="admin-view active" id="view-dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h3 style="margin-bottom: 5px; font-size: 1.1rem; text-transform: uppercase;">Rozcestník</h3>
            </div>
            <a href="../public/index.html" target="_blank" class="btn-secondary">🌐 Zobrazit web</a>
        </div>
        
        <div class="list-container" id="dashboard-list"></div>
    </div>

    <!-- VIEW 2: PRODUKTY (E-SHOP) -->
    <div class="admin-view" id="view-products">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <button class="btn-secondary" onclick="showDashboard()">← Zpět</button>
            <h3 style="font-size: 1.1rem; text-transform: uppercase;">🛒 E-Shop</h3>
        </div>

        <div class="list-container" id="products-list"></div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 40px 0;">

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;" id="product-form-container">
            <h3 style="margin-bottom: 24px; font-size: 1.1rem; color: var(--accent-cyan); text-transform: uppercase;" id="product-form-title">Přidat nový dron</h3>
            <form id="product-form">
                <input type="hidden" id="edit-prod-id">
                
                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Název dronu</label>
                        <input type="text" id="prod-title" required placeholder="SpeedIK v2">
                    </div>
                    <div class="field-group">
                        <label>Cena (Kč)</label>
                        <input type="number" id="prod-price" required placeholder="25000">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Kategorie</label>
                        <select id="prod-category">
                            <option value="cinematic">FPV Cinematic</option>
                            <option value="longrange">Longrange</option>
                            <option value="freestyle">Freestyle</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Specifikace</label>
                        <input type="text" id="prod-tag" placeholder="Cinematic 3.5&quot;">
                    </div>
                </div>

                <div class="field-group">
                    <label>Popis</label>
                    <textarea id="prod-desc" rows="4" placeholder="Popis dronu..."></textarea>
                </div>

                <div class="field-group">
                    <label>Technické parametry (Klíč / Hodnota)</label>
                    <div id="specs-builder"></div>
                    <button type="button" class="btn-secondary" id="add-spec-btn" style="width: max-content; margin-top: 8px;">+ Přidat parametr</button>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary" id="save-prod-btn">Uložit</button>
                    <button type="button" class="btn-secondary" id="cancel-edit-btn" style="display: none;">Zrušit úpravy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VIEW 3: EDITOR STRÁNEK -->
    <div class="admin-view" id="view-page-editor">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <button class="btn-secondary" onclick="showDashboard()">← Zpět</button>
            <h3 style="font-size: 1.1rem; text-transform: uppercase;" id="editor-page-heading">Úprava stránky</h3>
        </div>

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;">
            <form id="page-form">
                <input type="hidden" id="edit-page-id">
                
                <div class="field-group">
                    <label>Název</label>
                    <input type="text" id="page-title" required readonly style="opacity: 0.7;">
                </div>

                <div id="page-dynamic-fields"></div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary">Uložit změny na GitHub</button>
                    <button type="button" class="btn-secondary" onclick="showDashboard()">Zrušit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TERMINÁL PROCESU -->
    <div class="terminal-log" id="terminal-log">
        <div class="log-entry">[System] CMS připraveno.</div>
    </div>

</div>

<script>
    let productsData = [];
    let pagesData = [];

    const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
    const configPanel = document.getElementById('config-panel');
    const saveConfigBtn = document.getElementById('save-config-btn');

    toggleSettingsBtn.addEventListener('click', () => configPanel.classList.toggle('open'));

    function loadConfig() {
        document.getElementById('gh-owner').value = localStorage.getItem('sik_gh_owner') || 'JakubSimoncic';
        document.getElementById('gh-repo').value = localStorage.getItem('sik_gh_repo') || 'sik-group';
        document.getElementById('gh-branch').value = localStorage.getItem('sik_gh_branch') || 'main';
        document.getElementById('gh-token').value = localStorage.getItem('sik_gh_token') || '';
    }

    saveConfigBtn.addEventListener('click', () => {
        localStorage.setItem('sik_gh_owner', document.getElementById('gh-owner').value.trim());
        localStorage.setItem('sik_gh_repo', document.getElementById('gh-repo').value.trim());
        localStorage.setItem('sik_gh_branch', document.getElementById('gh-branch').value.trim());
        localStorage.setItem('sik_gh_token', document.getElementById('gh-token').value.trim());
        log('Konfigurace GitHubu uložena v prohlížeči.', 'success');
        configPanel.classList.remove('open');
    });

    function log(msg, type = '') {
        const terminal = document.getElementById('terminal-log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        terminal.appendChild(entry);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function switchView(viewId) {
        document.querySelectorAll('.admin-view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDashboard() {
        resetProductForm();
        switchView('view-dashboard');
    }

    async function initData() {
        try {
            const pagesRes = await fetch('../public/data/pages.json?t=' + Date.now());
            pagesData = await pagesRes.json();
            renderDashboard();
        } catch (e) {
            log('Chyba při načítání rozcestníku: ' + e.message, 'error');
        }
    }

    function renderDashboard() {
        const container = document.getElementById('dashboard-list');
        container.innerHTML = '';

        pagesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            const icon = item.icon || '📄';
            const subtitle = item.description || (item.file ? `Soubor: ${item.file}` : '');

            card.innerHTML = `
                <div class="item-info">
                    <div class="item-thumb">${icon}</div>
                    <div class="item-details">
                        <h4>${item.title}</h4>
                        <p>${subtitle}</p>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-primary" onclick="openSection('${item.id}')">Spravovat</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function openSection(id) {
        const item = pagesData.find(p => p.id === id);
        if (!item) return;

        if (item.type === 'products') {
            try {
                const prodRes = await fetch(`../public/${item.dataFile}?t=` + Date.now());
                productsData = await prodRes.json();
                renderProductsList();
            } catch (e) {
                log('Chyba při načítání produktů: ' + e.message, 'error');
            }
            switchView('view-products');
        } else {
            document.getElementById('edit-page-id').value = item.id;
            document.getElementById('page-title').value = item.title;
            document.getElementById('editor-page-heading').textContent = `Úprava stránky: ${item.title}`;

            const dynamicFields = document.getElementById('page-dynamic-fields');
            dynamicFields.innerHTML = '<p style="color: var(--text-muted);">Načítám data...</p>';

            const targetFile = item.dataFile || `data/${item.id}.json`;
            try {
                const res = await fetch(`../public/${targetFile}?t=` + Date.now());
                const pageContent = await res.json();

                dynamicFields.innerHTML = '';
                dynamicFields.dataset.dataFile = targetFile;

                Object.keys(pageContent).forEach(key => {
                    const val = pageContent[key];
                    const fieldGroup = document.createElement('div');
                    fieldGroup.className = 'field-group';

                    const label = document.createElement('label');
                    label.textContent = key.toUpperCase();

                    let input;
                    if (typeof val === 'string' && val.length > 50) {
                        input = document.createElement('textarea');
                        input.rows = 3;
                    } else {
                        input = document.createElement('input');
                        input.type = 'text';
                    }

                    input.className = 'page-field-input';
                    input.dataset.key = key;
                    input.value = val;

                    fieldGroup.appendChild(label);
                    fieldGroup.appendChild(input);
                    dynamicFields.appendChild(fieldGroup);
                });

                switchView('view-page-editor');
            } catch (err) {
                log('Chyba při načítání souboru stránky: ' + err.message, 'error');
            }
        }
    }

    function renderProductsList() {
        const container = document.getElementById('products-list');
        container.innerHTML = '';

        productsData.forEach(p => {
            const card = document.createElement('div');
            card.className = 'item-card';

            const imgPath = p.image || '../public/img/drone.png';
            const formattedPrice = p.price ? p.price.toLocaleString('cs-CZ') : 0;

            card.innerHTML = `
                <div class="item-info">
                    <img src="${imgPath}" alt="${p.title}" class="item-thumb" style="object-fit: cover;">
                    <div class="item-details">
                        <h4>${p.title}</h4>
                        <p>${p.categoryLabel || p.category} // ${formattedPrice} Kč</p>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-secondary" onclick="editProduct('${p.id}')">Upravit</button>
                    <button class="btn-delete" onclick="deleteProduct('${p.id}')">Smazat</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    const specsContainer = document.getElementById('specs-builder');
    document.getElementById('add-spec-btn').addEventListener('click', () => addSpecRow());

    function addSpecRow(key = '', val = '') {
        const row = document.createElement('div');
        row.className = 'spec-item-row';
        row.innerHTML = `
            <input type="text" class="spec-key" placeholder="Parametr" value="${key}" style="flex: 1;">
            <input type="text" class="spec-val" placeholder="Hodnota" value="${val}" style="flex: 1;">
            <button type="button" class="btn-delete" onclick="this.parentElement.remove()">✕</button>
        `;
        specsContainer.appendChild(row);
    }

    function editProduct(id) {
        const prod = productsData.find(p => String(p.id) === String(id));
        if (!prod) return;

        document.getElementById('edit-prod-id').value = prod.id;
        document.getElementById('prod-title').value = prod.title;
        document.getElementById('prod-price').value = prod.price;
        document.getElementById('prod-category').value = prod.category;
        document.getElementById('prod-tag').value = prod.tag || '';
        document.getElementById('prod-desc').value = prod.description || '';

        specsContainer.innerHTML = '';
        if (prod.specs) {
            Object.entries(prod.specs).forEach(([k, v]) => addSpecRow(k, v));
        }

        document.getElementById('product-form-title').textContent = `Upravit dron: ${prod.title}`;
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';

        const formContainer = document.getElementById('product-form-container');
        formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        log(`Načten k úpravě dron: ${prod.title}`, 'success');
    }

    function resetProductForm() {
        document.getElementById('product-form').reset();
        document.getElementById('edit-prod-id').value = '';
        document.getElementById('product-form-title').textContent = 'Přidat nový dron';
        document.getElementById('cancel-edit-btn').style.display = 'none';
        specsContainer.innerHTML = '';
    }

    document.getElementById('cancel-edit-btn').addEventListener('click', resetProductForm);

    async function commitFileToGithub(filePath, contentObject, commitMessage) {
        const owner = localStorage.getItem('sik_gh_owner') || 'JakubSimoncic';
        const repo = localStorage.getItem('sik_gh_repo') || 'sik-group';
        const branch = localStorage.getItem('sik_gh_branch') || 'main';
        const token = localStorage.getItem('sik_gh_token');

        if (!token || !owner || !repo) {
            log('Upozornění: Není vyplněn GitHub token. Úpravy nebyly odeslány.', 'error');
            return;
        }

        try {
            log(`Získávám SHA pro public/${filePath}...`);
            const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/public/${filePath}?ref=${branch}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            let sha = '';
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }

            log(`Odesílám novou verzi na GitHub...`);
            const jsonText = JSON.stringify(contentObject, null, 2);
            const base64Content = btoa(unescape(encodeURIComponent(jsonText)));

            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/public/${filePath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: base64Content,
                    sha: sha || undefined,
                    branch: branch
                })
            });

            if (!putRes.ok) throw new Error('Chyba GitHub API.');
            log(`✓ Úspěšně uloženo a zacommitováno na GitHub!`, 'success');
        } catch (err) {
            log(`Chyba: ${err.message}`, 'error');
        }
    }

    // Uložení editu stránky (home.json, contact.json apod.)
    document.getElementById('page-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const dynamicFields = document.getElementById('page-dynamic-fields');
        const dataFile = dynamicFields.dataset.dataFile;
        if (!dataFile) return;

        const updatedData = {};
        document.querySelectorAll('.page-field-input').forEach(input => {
            const key = input.dataset.key;
            updatedData[key] = input.value;
        });

        const pageTitle = document.getElementById('page-title').value;
        await commitFileToGithub(dataFile, updatedData, `CMS: Aktualizován soubor ${dataFile} (${pageTitle})`);
        showDashboard();
    });

    document.getElementById('product-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const editId = document.getElementById('edit-prod-id').value;
        const title = document.getElementById('prod-title').value;
        const price = parseFloat(document.getElementById('prod-price').value);
        const category = document.getElementById('prod-category').value;
        const tag = document.getElementById('prod-tag').value;
        const desc = document.getElementById('prod-desc').value;

        const specs = {};
        document.querySelectorAll('.spec-item-row').forEach(row => {
            const k = row.querySelector('.spec-key').value.trim();
            const v = row.querySelector('.spec-val').value.trim();
            if (k && v) specs[k] = v;
        });

        const catLabels = { cinematic: 'FPV Cinematic', longrange: 'Longrange', freestyle: 'Freestyle' };

        if (editId) {
            const idx = productsData.findIndex(p => String(p.id) === String(editId));
            if (idx !== -1) {
                productsData[idx] = {
                    ...productsData[idx],
                    title, price, category, tag, description: desc, specs,
                    categoryLabel: catLabels[category],
                    eurPrice: Math.round(price / 25)
                };
            }
        } else {
            const newProd = {
                id: String(Date.now()),
                title, price, category, tag, description: desc, specs,
                categoryLabel: catLabels[category],
                eurPrice: Math.round(price / 25),
                image: '../public/img/drone.png'
            };
            productsData.push(newProd);
        }

        renderProductsList();
        await commitFileToGithub('data/products.json', productsData, `CMS: Uložen dron ${title}`);
        resetProductForm();
    });

    async function deleteProduct(id) {
        const prod = productsData.find(p => String(p.id) === String(id));
        if (!confirm(`Opravdu chcete smazat dron "${prod ? prod.title : id}"?`)) return;

        productsData = productsData.filter(p => String(p.id) !== String(id));
        renderProductsList();
        await commitFileToGithub('data/products.json', productsData, `CMS: Smazán dron ${prod ? prod.title : id}`);
    }

    loadConfig();
    initData();
</script>

</body>
</html>
