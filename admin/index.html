<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIK-GROUP | CMS Rozcestník</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #070707;
            --card-border: #181818;
            --accent-cyan: #00D1C7;
            --text-main: #ffffff;
            --text-muted: #777777;
            --input-bg: #0f0f0f;
            --input-border: #222222;
            --danger-red: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .admin-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* HEADER */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-title span { color: var(--accent-cyan); }

        .settings-toggle-btn {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .settings-toggle-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* CONFIG PANEL */
        .config-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
            display: none;
        }

        .config-panel.open { display: block; }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
        }

        /* TABY */
        .nav-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            border-bottom: 2px solid var(--accent-cyan);
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        /* BUTTONS */
        .btn-primary {
            background: var(--accent-cyan);
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-delete {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: var(--danger-red);
            padding: 8px 14px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #ffffff;
        }

        /* KARTY ROZCESTNÍKU */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 6px;
            gap: 20px;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-thumb {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: #000;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }

        .item-details h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .item-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .spec-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .img-preview-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }

        .img-preview-box img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--card-border);
        }

        /* TERMINÁL LOGS */
        .terminal-log {
            background: #040404;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 18px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 40px;
            max-height: 160px;
            overflow-y: auto;
        }

        .log-entry { margin-bottom: 6px; }
        .log-entry.success { color: var(--accent-cyan); }
        .log-entry.error { color: var(--danger-red); }
    </style>
</head>
<body>

<div class="admin-wrapper">
    
    <div class="header-bar">
        <div class="brand-title">SIK-GROUP <span>// CMS ROZCESTNÍK</span></div>
        <button class="settings-toggle-btn" id="toggle-settings-btn">⚙ GitHub API Nastavení</button>
    </div>

    <!-- PANEL NASTAVENÍ GITHUBU -->
    <div class="config-panel" id="config-panel">
        <h3 style="font-size: 0.9rem; margin-bottom: 15px; color: var(--accent-cyan);">Konfigurace GitHub Repozitáře</h3>
        <div class="form-grid-3">
            <div class="field-group">
                <label>Vlastník (Owner)</label>
                <input type="text" id="gh-owner" value="JakubSimoncic">
            </div>
            <div class="field-group">
                <label>Repozitář (Repo)</label>
                <input type="text" id="gh-repo" value="sik-group">
            </div>
            <div class="field-group">
                <label>Větev (Branch)</label>
                <input type="text" id="gh-branch" value="main">
            </div>
        </div>
        <div class="field-group">
            <label>Personal Access Token (PAT)</label>
            <input type="password" id="gh-token" placeholder="github_pat_...">
        </div>
        <button class="btn-secondary" id="save-config-btn">Uložit Konfiguraci</button>
    </div>

    <!-- TABY -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('tab-products')">🛒 E-shop Produkty</button>
        <button class="tab-btn" onclick="openTab('tab-content')">📄 Rozcestník Stránek Webu</button>
    </div>

    <!-- ZÁLOŽKA 1: PRODUKTY -->
    <div class="tab-section active" id="tab-products">
        <h3 style="margin-bottom: 20px; font-size: 1.1rem; text-transform: uppercase;">Aktivní drony v e-shopu</h3>
        <div class="list-container" id="products-list"></div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 40px 0;">

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;">
            <h3 style="margin-bottom: 24px; font-size: 1.1rem; color: var(--accent-cyan); text-transform: uppercase;" id="product-form-title">Přidat nový dron</h3>
            <form id="product-form">
                <input type="hidden" id="edit-prod-id">
                
                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Název dronu</label>
                        <input type="text" id="prod-title" required placeholder="SpeedIK v2">
                    </div>
                    <div class="field-group">
                        <label>Cena (Kč)</label>
                        <input type="number" id="prod-price" required placeholder="25000">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Kategorie</label>
                        <select id="prod-category">
                            <option value="cinematic">FPV Cinematic</option>
                            <option value="longrange">Longrange</option>
                            <option value="freestyle">Freestyle</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Tag / Specifikace</label>
                        <input type="text" id="prod-tag" placeholder="Cinematic 3.5&quot;">
                    </div>
                </div>

                <div class="field-group">
                    <label>Popis dronu</label>
                    <textarea id="prod-desc" rows="4" placeholder="Detailní popis..."></textarea>
                </div>

                <div class="field-group">
                    <label>Fotka dronu</label>
                    <input type="file" id="prod-img-file" accept="image/*">
                    <div class="img-preview-box" id="current-img-preview-box" style="display: none;">
                        <img id="current-img-preview" src="" alt="Aktuální fotka">
                        <span style="font-size: 0.8rem; color: var(--text-muted);" id="current-img-path-text"></span>
                    </div>
                </div>

                <div class="field-group">
                    <label>Technické parametry (Klíč / Hodnota)</label>
                    <div id="specs-builder"></div>
                    <button type="button" class="btn-secondary" id="add-spec-btn" style="width: max-content; margin-top: 8px;">+ Přidat parametr</button>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary" id="save-prod-btn">Uložit & Commitnout na GitHub</button>
                    <button type="button" class="btn-secondary" id="cancel-edit-btn" style="display: none;">Zrušit úpravy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ZÁLOŽKA 2: ROZCESTNÍK STRÁNEK -->
    <div class="tab-section" id="tab-content">
        <h3 style="margin-bottom: 20px; font-size: 1.1rem; text-transform: uppercase;">Rozcestník stránek webu</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Vyberte stránku ze seznamu pro úpravu jejího obsahu:</p>
        
        <div class="list-container" id="pages-list"></div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 40px 0;">

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;" id="page-form-container">
            <h3 style="margin-bottom: 24px; font-size: 1.1rem; color: var(--accent-cyan); text-transform: uppercase;" id="page-form-title">Editor vybrané stránky</h3>
            <form id="page-form">
                <input type="hidden" id="edit-page-id">
                
                <div class="field-group">
                    <label>Upravovaná stránka</label>
                    <input type="text" id="page-title" required readonly style="opacity: 0.7;">
                </div>

                <!-- Dynamicky generovaná pole pro obsah konkrétní stránky -->
                <div id="page-dynamic-fields"></div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary" id="save-page-btn">Uložit & Commitnout na GitHub</button>
                    <button type="button" class="btn-secondary" id="cancel-page-edit-btn" style="display: none;">Zrušit výběr</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TERMINÁL PROCESU -->
    <div class="terminal-log" id="terminal-log">
        <div class="log-entry">[System] Rozcestník CMS připraven.</div>
    </div>

</div>

<script>
    let productsData = [];
    let pagesData = [];

    const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
    const configPanel = document.getElementById('config-panel');
    const saveConfigBtn = document.getElementById('save-config-btn');

    toggleSettingsBtn.addEventListener('click', () => configPanel.classList.toggle('open'));

    function loadConfig() {
        document.getElementById('gh-owner').value = localStorage.getItem('sik_gh_owner') || 'JakubSimoncic';
        document.getElementById('gh-repo').value = localStorage.getItem('sik_gh_repo') || 'sik-group';
        document.getElementById('gh-branch').value = localStorage.getItem('sik_gh_branch') || 'main';
        document.getElementById('gh-token').value = localStorage.getItem('sik_gh_token') || '';
    }

    saveConfigBtn.addEventListener('click', () => {
        localStorage.setItem('sik_gh_owner', document.getElementById('gh-owner').value.trim());
        localStorage.setItem('sik_gh_repo', document.getElementById('gh-repo').value.trim());
        localStorage.setItem('sik_gh_branch', document.getElementById('gh-branch').value.trim());
        localStorage.setItem('sik_gh_token', document.getElementById('gh-token').value.trim());
        log('Konfigurace GitHubu uložena v prohlížeči.', 'success');
        configPanel.classList.remove('open');
    });

    function log(msg, type = '') {
        const terminal = document.getElementById('terminal-log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        terminal.appendChild(entry);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    async function initData() {
        try {
            // Načtení produktů
            const prodRes = await fetch('../public/data/products.json');
            productsData = await prodRes.json();
            renderProductsList();

            // Načtení rozcestníku stránek z pages.json
            const pagesRes = await fetch('../public/data/pages.json');
            pagesData = await pagesRes.json();
            renderPagesList();
        } catch (e) {
            log('Chyba při načítání dat: ' + e.message, 'error');
        }
    }

    // --- PRODUKTY ---
    function renderProductsList() {
        const container = document.getElementById('products-list');
        container.innerHTML = '';

        if (productsData.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Žádné drony v databázi.</p>';
            return;
        }

        productsData.forEach(p => {
            const card = document.createElement('div');
            card.className = 'item-card';

            const imgPath = p.image || '../public/img/drone.png';
            const formattedPrice = p.price ? p.price.toLocaleString('cs-CZ') : 0;

            card.innerHTML = `
                <div class="item-info">
                    <img src="${imgPath}" alt="${p.title}" class="item-thumb" style="object-fit: cover;">
                    <div class="item-details">
                        <h4>${p.title}</h4>
                        <p>${p.categoryLabel || p.category} // ${formattedPrice} Kč</p>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-secondary" onclick="editProduct('${p.id}')">Upravit</button>
                    <button class="btn-delete" onclick="deleteProduct('${p.id}')">Smazat</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- ROZCESTNÍK STRÁNEK ---
    function renderPagesList() {
        const container = document.getElementById('pages-list');
        container.innerHTML = '';

        if (pagesData.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Žádné stránky v rozcestníku.</p>';
            return;
        }

        pagesData.forEach(page => {
            const card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <div class="item-info">
                    <div class="item-thumb">🌐</div>
                    <div class="item-details">
                        <h4>${page.title}</h4>
                        <p>Soubor: ${page.file}</p>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-secondary" onclick="editPage('${page.id}')">Upravit obsah stránky</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function editPage(id) {
        const page = pagesData.find(p => p.id === id);
        if (!page) return;

        document.getElementById('edit-page-id').value = page.id;
        document.getElementById('page-title').value = page.title;

        const dynamicFields = document.getElementById('page-dynamic-fields');
        dynamicFields.innerHTML = '';

        // Vytvoří vstupní pole pro každou vlastnost dané stránky
        Object.keys(page).forEach(key => {
            if (['id', 'title', 'file'].includes(key)) return;

            const val = page[key];
            const fieldGroup = document.createElement('div');
            fieldGroup.className = 'field-group';

            const label = document.createElement('label');
            label.textContent = key.toUpperCase();

            let input;
            if (typeof val === 'string' && val.length > 50) {
                input = document.createElement('textarea');
                input.rows = 3;
            } else {
                input = document.createElement('input');
                input.type = 'text';
            }

            input.className = 'page-field-input';
            input.dataset.key = key;
            input.value = val;

            fieldGroup.appendChild(label);
            fieldGroup.appendChild(input);
            dynamicFields.appendChild(fieldGroup);
        });

        document.getElementById('cancel-page-edit-btn').style.display = 'inline-block';
        window.scrollTo({ top: document.getElementById('page-form-container').offsetTop - 50, behavior: 'smooth' });
    }

    document.getElementById('cancel-page-edit-btn').addEventListener('click', () => {
        document.getElementById('page-form').reset();
        document.getElementById('edit-page-id').value = '';
        document.getElementById('page-dynamic-fields').innerHTML = '';
        document.getElementById('cancel-page-edit-btn').style.display = 'none';
    });

    // --- GITHUB API COMMIT ---
    async function commitFileToGithub(filePath, contentObject, commitMessage) {
        const owner = localStorage.getItem('sik_gh_owner') || 'JakubSimoncic';
        const repo = localStorage.getItem('sik_gh_repo') || 'sik-group';
        const branch = localStorage.getItem('sik_gh_branch') || 'main';
        const token = localStorage.getItem('sik_gh_token');

        if (!token || !owner || !repo) {
            log('Upozornění: Není vyplněn GitHub token.', 'error');
            return;
        }

        try {
            log(`1/2 Získávám SHA souboru ${filePath}...`);
            const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}?ref=${branch}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            let sha = '';
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }

            log(`2/2 Zapisuji commit na GitHub...`);
            const jsonText = JSON.stringify(contentObject, null, 2);
            const base64Content = btoa(unescape(encodeURIComponent(jsonText)));

            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: base64Content,
                    sha: sha || undefined,
                    branch: branch
                })
            });

            if (!putRes.ok) throw new Error('Chyba GitHub API odpovědi.');
            log(`✓ Úspěšně uloženo a zacommitováno na GitHub!`, 'success');
        } catch (err) {
            log(`Chyba: ${err.message}`, 'error');
        }
    }

    // --- SUBMIT STRÁNEK ---
    document.getElementById('page-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const editId = document.getElementById('edit-page-id').value;
        if (!editId) {
            log('Vyberte nejprve stránku k úpravě.', 'error');
            return;
        }

        const pageIdx = pagesData.pages.findIndex(p => p.id === editId); // příp. podle struktury JSON
        // Jelikož pagesData je pole:
        const idx = pagesData.findIndex(p => p.id === editId);
        if (idx === -1) return;

        document.querySelectorAll('.page-field-input').forEach(input => {
            const key = input.dataset.key;
            pagesData[idx][key] = input.value;
        });

        renderPagesList();
        await commitFileToGithub('public/data/pages.json', pagesData, `CMS: Aktualizována stránka ${pagesData[idx].title}`);
    });

    // Další pomocné funkce pro produkty
    async function deleteProduct(id) {
        const prod = productsData.find(p => p.id === id);
        if (!confirm(`Opravdu chcete smazat dron "${prod ? prod.title : id}"?`)) return;

        productsData = productsData.filter(p => p.id !== id);
        renderProductsList();
        await commitFileToGithub('public/data/products.json', productsData, `CMS: Smazán dron ${prod ? prod.title : id}`);
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    loadConfig();
    initData();
</script>

</body>
</html>
