<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIK-GROUP | CMS Rozcestník (CZ / EN)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

<div class="admin-wrapper">
    
    <div class="header-bar">
        <div class="brand-title">SIK-GROUP <span>// CMS</span></div>
        <div class="header-right">
            <button class="lang-switch-btn active" id="lang-cz-btn" type="button" onclick="setAdminLanguage('cz')">CZ</button>
            <button class="lang-switch-btn" id="lang-en-btn" type="button" onclick="setAdminLanguage('en')">EN</button>
            <button class="settings-toggle-btn" id="toggle-settings-btn" type="button">⚙ NASTAVENÍ</button>
        </div>
    </div>

    <!-- PANEL NASTAVENÍ GITHUBU -->
    <div class="config-panel" id="config-panel">
        <h3 style="font-size: 0.9rem; margin-bottom: 15px; color: var(--accent-cyan);">Konfigurace GitHub Repozitáře</h3>
        <div class="form-grid-3">
            <div class="field-group">
                <label>Vlastník (Owner)</label>
                <input type="text" id="gh-owner" value="JakubSimoncic">
            </div>
            <div class="field-group">
                <label>Repozitář (Repo)</label>
                <input type="text" id="gh-repo" value="sik-group">
            </div>
            <div class="field-group">
                <label>Větev (Branch)</label>
                <input type="text" id="gh-branch" value="main">
            </div>
        </div>
        <div class="field-group">
            <label>Personal Access Token (PAT)</label>
            <input type="password" id="gh-token" placeholder="github_pat_...">
        </div>
        <button class="btn-secondary" id="save-config-btn" type="button">Uložit</button>
    </div>

    <!-- VIEW 1: ROZCESTNÍK -->
    <div class="admin-view active" id="view-dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h3 style="margin-bottom: 5px; font-size: 1.1rem; text-transform: uppercase;">Rozcestník obsahu</h3>
            </div>
            <a href="../index.html" target="_blank" class="btn-secondary">🌐 Zobrazit web</a>
        </div>
        
        <div class="list-container" id="dashboard-list"></div>
    </div>

    <!-- VIEW 2: PRODUKTY & TEXTY E-SHOPU -->
    <div class="admin-view" id="view-products">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <button class="btn-secondary" onclick="showDashboard()" type="button">← Zpět</button>
            <h3 style="font-size: 1.1rem; text-transform: uppercase;">E-Shop (Správa textů a produktů)</h3>
        </div>

        <!-- Úprava VŠECH textů e-shopu -->
        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 8px; margin-bottom: 30px;">
            <h4 style="font-size: 0.9rem; color: var(--accent-cyan); margin-bottom: 15px; text-transform: uppercase;">Nastavení a texty E-shopu</h4>
            <div id="shop-texts-dynamic-fields" class="form-grid-2"></div>
            <button type="button" class="btn-secondary" id="save-shop-texts-btn" style="margin-top: 15px;">Uložit texty E-Shopu</button>
        </div>

        <h4 style="font-size: 0.9rem; color: var(--accent-cyan); margin-bottom: 15px; text-transform: uppercase;">Seznam Dronů</h4>
        <div class="list-container" id="products-list"></div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 40px 0;">

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;" id="product-form-container">
            <h3 style="margin-bottom: 24px; font-size: 1.1rem; color: var(--accent-cyan); text-transform: uppercase;" id="product-form-title">Přidat nový dron</h3>
            <form id="product-form">
                <input type="hidden" id="edit-prod-id">
                
                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Název dronu</label>
                        <input type="text" id="prod-title" required placeholder="SpeedIK v2">
                    </div>
                    <div class="field-group">
                        <label>Kategorie</label>
                        <select id="prod-category">
                            <option value="cinematic">FPV Cinematic</option>
                            <option value="longrange">Longrange</option>
                            <option value="freestyle">Freestyle</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="field-group">
                        <label>Cena (Kč)</label>
                        <input type="number" id="prod-price" required placeholder="25000">
                    </div>
                    <div class="field-group">
                        <label>Cena (EUR)</label>
                        <input type="number" id="prod-eur-price" required placeholder="1000">
                    </div>
                </div>

                <!-- Specifikace / Tag (CZ / EN rozlišené) -->
                <div class="form-grid-2">
                    <div class="field-group cz-only-field">
                        <label>Specifikace / Tag <span class="lang-badge">[CZ]</span></label>
                        <input type="text" id="prod-tag" placeholder="Cinematic Spec">
                    </div>
                    <div class="field-group en-only-field" style="display:none;">
                        <label>Specifikace / Tag <span class="lang-badge">[EN]</span></label>
                        <input type="text" id="prod-tag-en" placeholder="Cinematic Spec">
                    </div>
                </div>

                <!-- Popis dronu (CZ / EN rozlišené) -->
                <div class="form-grid-2">
                    <div class="field-group cz-only-field">
                        <label>Popis dronu <span class="lang-badge">[CZ]</span></label>
                        <textarea id="prod-desc" rows="4" placeholder="Český popis dronu..."></textarea>
                    </div>
                    <div class="field-group en-only-field" style="display:none;">
                        <label>Popis dronu <span class="lang-badge">[EN]</span></label>
                        <textarea id="prod-desc-en" rows="4" placeholder="English description of the drone..."></textarea>
                    </div>
                </div>

                <div class="field-group">
                    <label>Technické parametry (Klíč / Hodnota)</label>
                    <div id="specs-builder"></div>
                    <button type="button" class="btn-secondary" id="add-spec-btn" style="width: max-content; margin-top: 8px;">+ Přidat parametr</button>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary" id="save-prod-btn">Uložit dron</button>
                    <button type="button" class="btn-secondary" id="cancel-edit-btn" style="display: none;">Zrušit úpravy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VIEW 3: EDITOR OBSAHU STRÁNEK -->
    <div class="admin-view" id="view-page-editor">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <button class="btn-secondary" onclick="showDashboard()" type="button">← Zpět</button>
            <h3 style="font-size: 1.1rem; text-transform: uppercase;" id="editor-page-heading">Úprava obsahu stránky</h3>
        </div>

        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 8px;">
            <form id="page-form">
                <input type="hidden" id="edit-page-id">
                
                <div class="field-group" style="display:none;">
                    <label>Název sekce</label>
                    <input type="text" id="page-title" required readonly>
                </div>

                <div id="page-dynamic-fields"></div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn-primary">Uložit změny na GitHub</button>
                    <button type="button" class="btn-secondary" onclick="showDashboard()">Zrušit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TERMINÁL PROCESU -->
    <div class="terminal-log" id="terminal-log">
        <div class="log-entry">[System] CMS připraveno (Multijazyční režim CZ/EN).</div>
    </div>

</div>

</body>
</html>
