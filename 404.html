<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | SIK-GROUP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/sik-group/public/css/404.css">
</head>
<body>
    <main class="error-404-wrapper">
        <div class="error-container">
            <div class="error-logo">
                <a href="/sik-group/index.html">
                    <img src="/sik-group/public/img/logo.svg" alt="SIK-GROUP" width="150" height="38">
                </a>
            </div>

            <div class="error-tag" id="err-tag">ZTRÁTA SIGNÁLU</div>
            <div class="error-code">404</div>
            <h1 class="error-title" id="err-title">Stránka nebyla nalezena</h1>
            <p class="error-desc" id="err-desc">
                Požadovaná adresa neexistuje nebo byla přesunuta mimo letovou zónu. Zkontrolujte zadaný odkaz nebo se vraťte zpět na hlavní stránku.
            </p>
            <div class="error-path" id="err-path"></div>

            <div class="error-actions">
                <a href="/sik-group/index.html" class="btn-primary" id="err-btn-home">Zpět na úvod</a>
                <a href="/sik-group/public/pages/kontakt.html" class="btn-secondary" id="err-btn-contact">Kontakt</a>
            </div>
        </div>
    </main>

    <script src="/sik-group/public/js/404.js" defer></script>
</body>
</html>
