<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIK-GROUP | Osobní akce & Svatby</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sluzby.css">
</head>
<body data-service="osobni_akce">
    <header>
        <div id="nav-wrapper">
            <nav id="main-nav" class="global-container">
                <div class="logo">
                    <a href="../../index.html" id="header-logo-link">
                        <img src="../img/logo.svg" alt="SIK-GROUP" width="160" height="40" decoding="async">
                    </a>
                </div>
                
                <div class="nav-right-controls">
                    <div class="lang-switcher" id="dynamic-lang-switcher"></div>
                    
                    <div class="menu-toggle" id="mobile-menu">
                        <span class="bar b1"></span>
                        <span class="bar b2"></span>
                    </div>
                </div>
            </nav>

            <div class="nav-drop-panel" id="nav-panel">
                <div class="panel-grid">
                    <div class="panel-main">
                        <ul class="nav-list" id="dynamic-nav-list">
                            <!-- Dynamicky naplněno z common.json -->
                        </ul>
                    </div>
                    
                    <div class="panel-side">
                        <div class="side-block">
                            <span id="label-header-email">Email</span>
                            <a href="#" class="side-email" id="header-email"></a>
                            <span id="label-header-phone">Telefon</span>
                            <a href="#" class="side-phone" id="header-phone"></a>
                        </div>
                        <div class="side-block">
                            <span id="label-header-socials">Sociální sítě</span>
                            <div class="side-socials" id="header-socials">
                                <!-- Dynamicky naplněno z common.json -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="nav-dim-overlay" id="nav-overlay"></div>
    </header>

    <main class="srv-page">
        <section class="srv-hero">
            <div class="srv-container">
                <span class="srv-eyebrow" id="srv-eyebrow"></span>
                <h1 class="srv-title" id="srv-title"></h1>
                <p class="srv-subtitle" id="srv-subtitle"></p>
                <div class="srv-hero-actions">
                    <a href="../../index.html#booking" class="srv-btn-primary" id="srv-cta-primary"></a>
                    <a href="#vyber-del" class="srv-btn-secondary" id="srv-cta-secondary"></a>
                </div>
            </div>
        </section>

        <section class="srv-showreel">
            <div class="srv-container">
                <div class="srv-stage-frame" id="srv-stage-frame"></div>
                <div class="srv-stage-meta">
                    <span class="srv-stage-title" id="srv-stage-title"></span>
                    <span class="srv-spec-pill" id="srv-stage-spec"></span>
                </div>
            </div>
        </section>

        <section class="srv-works" id="vyber-del">
            <div class="srv-container">
                <div class="srv-works-header">
                    <h2 class="srv-section-title" id="srv-works-title"></h2>
                    <div class="srv-filter-bar" id="srv-filter-bar"></div>
                </div>
                <div class="srv-works-grid" id="srv-works-grid"></div>
            </div>
        </section>

        <section class="srv-specs-section">
            <div class="srv-container">
                <h2 class="srv-section-title" id="srv-specs-title"></h2>
                <div class="srv-specs-grid" id="srv-specs-grid"></div>
            </div>
        </section>

        <section class="srv-cta-section">
            <div class="srv-container">
                <div class="srv-cta-banner">
                    <h2 id="srv-bottom-title"></h2>
                    <p id="srv-bottom-text"></p>
                    <a href="../../index.html#booking" class="srv-btn-primary" id="srv-bottom-btn"></a>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="global-container">
            <div class="footer-grid" id="dynamic-footer-grid">
                <!-- Dynamicky naplněno z common.json -->
            </div>
            <div class="footer-bottom">
                <p id="footer-copyright">&copy; 2026 SIK-GROUP.</p>
            </div>
        </div>
    </footer>

    <!-- Globální script -->
    <script src="../js/script.js" defer></script>
    <!-- Stránkový script -->
    <script src="../js/sluzby.js" defer></script>
</body>
</html>
