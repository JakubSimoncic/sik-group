<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIK-GROUP | Velké eventy & Festivaly</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sluzby.css">
</head>
<body data-service="firemni_akce">

    <header id="navbar" class="navbar"></header>

    <main class="srv-page">
        <section class="srv-hero">
            <div class="srv-container">
                <span class="srv-eyebrow" id="srv-eyebrow"></span>
                <h1 class="srv-title" id="srv-title"></h1>
                <p class="srv-subtitle" id="srv-subtitle"></p>
                <div class="srv-hero-actions">
                    <a href="../../index.html#booking" class="srv-btn-primary" id="srv-cta-primary"></a>
                    <a href="#vyber-del" class="srv-btn-secondary" id="srv-cta-secondary"></a>
                </div>
            </div>
        </section>

        <section class="srv-showreel">
            <div class="srv-container">
                <div class="srv-stage-frame" id="srv-stage-frame"></div>
                <div class="srv-stage-meta">
                    <span class="srv-stage-title" id="srv-stage-title"></span>
                    <span class="srv-spec-pill" id="srv-stage-spec"></span>
                </div>
            </div>
        </section>

        <section class="srv-works" id="vyber-del">
            <div class="srv-container">
                <div class="srv-works-header">
                    <h2 class="srv-section-title" id="srv-works-title"></h2>
                    <div class="srv-filter-bar" id="srv-filter-bar"></div>
                </div>
                <div class="srv-works-grid" id="srv-works-grid"></div>
            </div>
        </section>

        <section class="srv-specs-section">
            <div class="srv-container">
                <h2 class="srv-section-title" id="srv-specs-title"></h2>
                <div class="srv-specs-grid" id="srv-specs-grid"></div>
            </div>
        </section>

        <section class="srv-cta-section">
            <div class="srv-container">
                <div class="srv-cta-banner">
                    <h2 id="srv-bottom-title"></h2>
                    <p id="srv-bottom-text"></p>
                    <a href="../../index.html#booking" class="srv-btn-primary" id="srv-bottom-btn"></a>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer" class="footer"></footer>

    <script src="../js/script.js"></script>
    <script src="../js/sluzby.js"></script>
</body>
</html>
